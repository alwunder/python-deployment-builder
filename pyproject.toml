[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-deployment-builder"
version = "0.1.0"
description = "Statically assess, plan, generate, and validate no-admin Python deployments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Andrew Wunderlich" }]
dependencies = [
    "packaging>=24.0,<27",
    "pathspec>=0.12,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
pdbuilder = "python_deployment_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_deployment_builder = ["templates/windows_uv/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
