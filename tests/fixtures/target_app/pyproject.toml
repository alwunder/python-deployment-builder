[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "target-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai>=2",
  "pydantic>=2",
  "PyYAML>=6",
  "Pillow>=10",
  "tksheet>=7",
  "typer>=0.12",
  "rich>=13",
]

[project.scripts]
target-cli = "target_app.cli:app"
target-gui = "target_app.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
