version = 1
requires-python = ">=3.11"

[[package]]
name = "clr-loader"
version = "0.2.7"
source = { registry = "https://pypi.org/simple" }
wheels = [{ url = "https://example.invalid/clr_loader-0.2.7-py3-none-any.whl" }]

[[package]]
name = "proxy-tools"
version = "0.1.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://example.invalid/proxy_tools-0.1.0.tar.gz" }

[[package]]
name = "pyproj"
version = "3.7.2"
source = { registry = "https://pypi.org/simple" }
wheels = [{ url = "https://example.invalid/pyproj-3.7.2-cp312-cp312-win_amd64.whl" }]

[[package]]
name = "pythonnet"
version = "3.0.5"
source = { registry = "https://pypi.org/simple" }
wheels = [{ url = "https://example.invalid/pythonnet-3.0.5-py3-none-any.whl" }]

[[package]]
name = "pywebview"
version = "6.2.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "proxy-tools" },
    { name = "pythonnet" },
]
wheels = [{ url = "https://example.invalid/pywebview-6.2.1-py3-none-any.whl" }]

[[package]]
name = "optional-map-app"
source = { editable = "." }
dependencies = [{ name = "pyproj" }]

[package.optional-dependencies]
dev = []
map = [
    { name = "clr-loader", marker = "sys_platform == 'win32'" },
    { name = "pythonnet", marker = "sys_platform == 'win32'" },
    { name = "pywebview", marker = "sys_platform == 'win32'" },
]
